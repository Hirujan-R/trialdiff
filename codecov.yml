coverage:
  precision: 2
  round: down
  range: "70...95"
  status:
    project:
      default:
        target: 85%
        threshold: 1%
        informational: false
    patch:
      default:
        target: 80%
        threshold: 5%

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false

ignore:
  - "data-raw/"
  - "R/data.R"
  - "R/trialdiff-package.R"
  - "R/conditions.R"
